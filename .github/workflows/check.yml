name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    # To publish the build as a release (scripts/release-apk.sh).
    permissions:
      contents: write
    steps:
      # Not a shallow clone: the app's version is how many commits the
      # branch has (app/build.gradle.kts).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/rust
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK packages, cargo-ndk
        run: scripts/setup-android-sdk.sh
      - run: scripts/check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      # Every commit on main becomes a downloadable build, named by its
      # version; the workflow artifact above expires, a release does not.
      - name: Publish the build as a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-apk.sh

  # The part no cloud session can run (no KVM there): the core loading on
  # Android itself, and the app starting. minSdk and a current API level.
  emulator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      # Not a shallow clone: the app's version is how many commits the
      # branch has (app/build.gradle.kts).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/rust
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK packages, cargo-ndk
        run: scripts/setup-android-sdk.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the APKs before the emulator starts
        run: ./gradlew --console=plain :core:assembleDebugAndroidTest :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          # On failure, print each failing test's stack trace into the log.
          script: ./gradlew --console=plain --continue :core:connectedDebugAndroidTest :app:connectedDebugAndroidTest || (scripts/android-test-failures.sh; exit 1)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports-${{ matrix.api-level }}
          path: |
            */build/reports/androidTests
            */build/outputs/androidTest-results
