name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Not a shallow clone: the app's version is how many commits the
      # branch has (app/build.gradle.kts).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/rust
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK packages, cargo-ndk
        run: scripts/setup-android-sdk.sh
      - run: scripts/check.sh
      # The metadata travels with the APK: it carries the version, and the
      # release job names itself from it rather than computing it again.
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/output-metadata.json

  # Every commit on main becomes a downloadable build, named by its version;
  # the workflow artifact above expires, a release does not.
  #
  # It waits for the emulators (agreed with the user 2026-10-05): the release
  # step used to sit in `check`, and v0.2.0 was published with a Hebrew that
  # no phone would have read while both emulator jobs were red. A broken
  # build under a permanent URL is worse than a release five minutes later.
  release:
    needs: [check, emulator]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Not a shallow clone, as in the other jobs: nothing here computes the
      # version — it comes from the build's own metadata — but a gradle call
      # added later would, and would get the depth of the clone instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The APK `check` built, put back where scripts/release-apk.sh looks
      # for it, so the published build is the one that was tested.
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug
      - name: Publish the build as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-apk.sh

  # The part no cloud session can run (no KVM there): the core loading on
  # Android itself, and the app starting. minSdk and a current API level.
  emulator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      # Not a shallow clone: the app's version is how many commits the
      # branch has (app/build.gradle.kts).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/rust
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK packages, cargo-ndk
        run: scripts/setup-android-sdk.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the APKs before the emulator starts
        run: ./gradlew --console=plain :core:assembleDebugAndroidTest :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          # On failure, print each failing test's stack trace into the log.
          script: ./gradlew --console=plain --continue :core:connectedDebugAndroidTest :app:connectedDebugAndroidTest || (scripts/android-test-failures.sh; exit 1)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports-${{ matrix.api-level }}
          path: |
            */build/reports/androidTests
            */build/outputs/androidTest-results
