# The Rust side of the Android app: one cdylib over the shared core, and the
# bindings generator that matches it. The core itself is not here — it is
# synesthesia-core, pinned by revision (PLAN.md decision 2). Bump `rev` in
# both crates together, on purpose, and run scripts/check.sh.
[workspace]
resolver = "2"
members = ["syn-android", "uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
syn-ffi = { git = "https://github.com/dmitryweiner/synesthesia-core", rev = "57d7f170a7fa5868ee824a142f051c04c50b2e73" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
